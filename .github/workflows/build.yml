name: Build Intergram

# Realistic CI for the Intergram mirror.
# - Builds one ABI per run: the full native build (ffmpeg, webrtc, tdlib,
#   boringssl) needs several GB of disk and does not fit a GitHub-hosted
#   runner when all four ABIs plus the universal APK are produced at once.
# - Never uses upstream credentials. All secrets are optional: without them the
#   build still compiles, but the resulting APK cannot log in (apiId 0) and
#   push notifications stay disabled (placeholder google-services.json).

on:
  workflow_dispatch:
    inputs:
      abi:
        description: Target ABI
        type: choice
        options: [arm64-v8a, armeabi-v7a, x86_64, x86]
        default: arm64-v8a
      variant:
        description: Build variant
        type: choice
        options: [debug, release]
        default: debug
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: build-${{ github.ref }}-${{ github.event.inputs.variant || 'debug' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
  CCACHE_NOHASHDIR: "true"
  CCACHE_MAXSIZE: "2G"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/chromium /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37 cmake;3.22.1"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      - name: Configure local.properties
        env:
          TG_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TG_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          SENTRY_DSN_VALUE: ${{ secrets.SENTRY_DSN }}
        run: |
          # Secrets are optional: an empty apiId/apiHash still compiles, but the
          # resulting APK cannot authenticate against Telegram. Never commit this file.
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "apiId=${TG_API_ID:-0}"
            echo "apiHash=${TG_API_HASH:-}"
            echo "sentryDsn=${SENTRY_DSN_VALUE:-}"
            echo "helperBotId=0"
            echo "helperBotUsername="
            echo "mapsApiKey="
          } > local.properties

      - name: Configure google-services.json
        env:
          GSC_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          # Structural placeholder only: no real project, no working FCM.
          PLACEHOLDER_GSC: '{"project_info":{"project_number":"000000000000","project_id":"intergram-placeholder","storage_bucket":"intergram-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"app.intergram.android"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyPlaceholderKeyNotForProduction00"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:000000000000:android:1111111111111111111111","android_client_info":{"package_name":"app.intergram.android.beta"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSyPlaceholderKeyNotForProduction00"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}'
        run: |
          if [ -n "${GSC_JSON_B64}" ]; then
            printf '%s' "${GSC_JSON_B64}" | base64 -d > TMessagesProj_App/google-services.json
            echo "Using the Firebase configuration stored in repository secrets."
          else
            printf '%s' "${PLACEHOLDER_GSC}" > TMessagesProj_App/google-services.json
            echo "::warning::Placeholder google-services.json in use - FCM push notifications will not work."
          fi
          python3 -c "import json,sys; json.load(open('TMessagesProj_App/google-services.json')); print('google-services.json is valid JSON')"

      - name: Build
        env:
          ABI: ${{ github.event.inputs.abi || 'arm64-v8a' }}
          VARIANT: ${{ github.event.inputs.variant || 'debug' }}
        run: |
          case "${VARIANT}" in
            release) TASK=assembleRelease ;;
            *)       TASK=assembleDebug ;;
          esac
          ./gradlew "${TASK}" -Pandroid.injected.build.abi="${ABI}" --stacktrace

      - name: Show outputs
        if: always()
        run: find TMessagesProj_App/build/outputs -name '*.apk' -o -name '*.aab' | sort

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: intergram-${{ github.event.inputs.variant || 'debug' }}-${{ github.event.inputs.abi || 'arm64-v8a' }}
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
